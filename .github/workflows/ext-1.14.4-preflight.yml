name: Extension 1.14.4 Preflight Patch

on:
  push:
    branches:
      - gsgrowt-ext-1.14.4-preflight

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 1.14.4 preflight patch
        run: python3 .github/scripts/patch_ext_1_14_4.py

      - name: Extension tests
        run: node tests/run-all.js

      - name: Hub PHP syntax
        run: find constello-dropship-hub -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Hub stabilization tests
        run: php constello-dropship-hub/tests/run.php

      - name: Commit tested patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor.js manifest.json tests/workspace-documents-size.test.js tests/import-preflight.test.js tests/run-all.js
          git diff --cached --check
          git commit -m "Extension 1.14.4: preflight duplicates before media"
          git push origin HEAD:gsgrowt-ext-1.14.4-preflight
